<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- width=device-width keeps a phone from laying the page out at ~980px and
       zooming out; viewport-fit=cover is what makes the env(safe-area-inset-*)
       padding in the HUD styles actually resolve on notched screens. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12111a">
  <meta name="description" content="Dice with spice!">
  <title>Super Rollies</title>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Karla:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="./styles.css">

  <!-- Pinned here rather than in each module, so there's one place to change a
       version. Import maps are supported by every current browser. -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "@dimforge/rapier3d-deterministic-compat": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-deterministic-compat@0.21.0/dist/rapier.mjs",
      "peerjs": "https://cdn.jsdelivr.net/npm/peerjs@1.5.5/+esm"
    }
  }
  </script>
</head>
<body>

<canvas id="scene"></canvas>

<!-- Top-left corner: outside the tray as drawn on every screen shape, so no die
     can come to rest under it (a tappable control over a resting die would
     steal the tap meant to pick it up). -->
<button class="back-btn" id="backBtn" hidden aria-label="Back to the menu">&larr; Menu</button>

<!-- The match's dice and Spice; tapping it shows their full rules. Top-right,
     mirroring the back button, for the same reason: no die can rest under it
     (docs/history.md 4.6a). -->
<button class="match-info" id="matchInfo" hidden aria-label="This match's rules">
  <span class="match-info-dice" id="matchInfoDice"></span>
  <span class="match-info-spice" id="matchInfoSpice"></span>
</button>

<!-- Each side's card (docs/spec.md R6.4): its name, any state-based advantage
     it holds, and its match state as the win condition draws it: hearts
     (with any marks, such as failed death saves), or a bar (Hit Points, a
     race's score, the ground left in a tug of war). Takes no pointer events. -->
<div class="hud top" id="opponentHud" hidden>
  <div class="player-card" id="opponentCard">
    <div class="pc-name" id="opponentName">Opponent</div>
    <div class="pc-foot">
      <span class="edge" id="opponentEdge" hidden></span>
      <div class="pc-state">
        <div class="marks" id="opponentMarks" hidden></div>
        <div class="hearts" id="opponentHearts"></div>
        <div class="meter" id="opponentMeter" hidden><div class="meter-fill"></div><span class="meter-text"></span></div>
      </div>
    </div>
  </div>
</div>

<!-- What the Spice says about the coming round (a cursed number, the stakes).
     Not tappable, so it may sit over the tray. -->
<div class="announce" id="announce" hidden></div>

<!-- A multiplayer match's clock (docs/decisions.md D48): your time left to
     throw, or who's being waited on. Not tappable either. -->
<div class="net-status" id="netStatus" hidden></div>

<div class="hud bottom" id="youHud" hidden>
  <div class="player-card" id="youCard">
    <div class="pc-name" id="youName"></div>
    <div class="pc-foot">
      <span class="edge" id="youEdge" hidden></span>
      <div class="pc-state">
        <div class="marks" id="youMarks" hidden></div>
        <div class="hearts" id="youHearts"></div>
        <div class="meter" id="youMeter" hidden><div class="meter-fill"></div><span class="meter-text"></span></div>
      </div>
    </div>
  </div>
</div>

<!-- A chance to throw again once the round's result is shown (Second Wind,
     Mercy), or to keep all your dice rather than throw some again (Draw
     Poker). Right under the result card, kept clear of the dice lying there
     (docs/history.md 4.6a); bottom-right if there's no clear spot by the card. -->
<button class="rethrow-btn" id="rethrowBtn" hidden></button>

<div id="result">
  <p class="headline" id="resultHeadline"></p>
  <p class="detail" id="resultDetail"></p>
</div>

<div class="menu-overlay" id="menu">
  <div class="menu-card" id="menuMain">
    <h1 class="menu-title">Super Rollies</h1>
    <div class="menu-player">
      <div class="player-card" id="menuCard">
        <div class="pc-name" id="menuName"></div>
        <div class="pc-foot"><span class="pc-look" id="menuLook"><span class="pc-look-die"></span></span></div>
      </div>
      <button class="edit-btn" id="editBtn" aria-label="Edit your player" title="Edit your player">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4zM14 6l4 4"/></svg>
      </button>
    </div>
    <div class="menu-buttons">
      <button class="menu-btn" id="quickGameBtn" disabled>Loading…</button>
      <button class="menu-btn secondary" id="zenBtn" disabled>Zen</button>
      <!-- Multiplayer (Phase 7): shown by net/lobby.js, which the artifact
           build leaves out (docs/spec.md R4.6). -->
      <button class="menu-btn secondary" id="netBtn" disabled hidden>Play a friend</button>
      <!-- Development only, behind ?dev (docs/decisions.md D39): any dice set,
           then any Spice it allows, without the draft. -->
      <button class="menu-btn secondary" id="testBenchBtn" disabled hidden>Test bench</button>
    </div>
    <p class="menu-status" id="menuStatus" hidden></p>
  </div>
  <div class="menu-card" id="draft" hidden>
    <p class="draft-step" id="draftStep"></p>
    <h2 class="picker-title" id="draftTitle"></h2>
    <p class="draft-chosen" id="draftChosen" hidden></p>
    <div class="draft-cards" id="draftCards"></div>
    <button class="picker-back" id="draftBack">&larr; Back</button>
  </div>
  <!-- The player editor (R6.8): over the table, which shows the tray and
       dice in the colours picked as they're picked. -->
  <div class="menu-card editor" id="editor" hidden>
    <h2 class="picker-title">Your player</h2>
    <div class="player-card" id="editorCard">
      <div class="pc-name" id="editorCardName"></div>
      <div class="pc-foot"><span class="pc-look" id="editorLook"><span class="pc-look-die"></span></span></div>
    </div>
    <label class="editor-name">
      <span class="editor-label">Name</span>
      <input id="editorName" type="text" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="done">
      <span class="editor-count" id="editorCount"></span>
    </label>
    <div class="editor-row"><span class="editor-label" id="editorCardsLabel">Card</span>
      <div class="swatches" id="editorCards" role="radiogroup" aria-labelledby="editorCardsLabel"></div></div>
    <div class="editor-row"><span class="editor-label" id="editorTraysLabel">Tray</span>
      <div class="swatches" id="editorTrays" role="radiogroup" aria-labelledby="editorTraysLabel"></div></div>
    <div class="editor-row"><span class="editor-label" id="editorDiceLabel">Dice</span>
      <div class="swatches" id="editorDice" role="radiogroup" aria-labelledby="editorDiceLabel"></div></div>
    <div class="editor-buttons">
      <button class="picker-back" id="editorBack">&larr; Back</button>
      <button class="menu-btn" id="editorSave">Save</button>
    </div>
  </div>
  <!-- Multiplayer: host a room or join one (net/lobby.js). -->
  <div class="menu-card net" id="netMenu" hidden>
    <h2 class="picker-title">Play a friend</h2>
    <button class="menu-btn" id="netHostBtn">Host a game</button>
    <form class="net-join" id="netJoinForm">
      <label class="editor-label" for="netCodeInput">Or join with a code</label>
      <div class="net-row">
        <input id="netCodeInput" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false"
          maxlength="7" placeholder="ABCDE" enterkeyhint="go">
        <button class="menu-btn secondary" id="netJoinBtn" type="submit">Join</button>
      </div>
    </form>
    <p class="menu-status" id="netMenuStatus" hidden></p>
    <button class="picker-back" id="netMenuBack">&larr; Back</button>
  </div>
  <!-- The room, between matches, on both screens (docs/spec.md R7): both
       players' cards, each with its Ready mark and games won; the host's
       code and link; the dice and Spice chosen, in full (R4.2). -->
  <div class="menu-card net" id="netRoom" hidden>
    <p class="draft-step" id="netRoomStep"></p>
    <div class="net-versus" id="netVersus">
      <div class="net-seat" id="netMe">
        <div class="player-card" id="netMeCard" role="button" tabindex="0" title="Edit your player" aria-label="Edit your player">
          <div class="pc-name" id="netMeName"></div>
          <div class="pc-foot"><span class="net-ready" id="netMeReady"></span><span class="pc-look" id="netMeLook"><span class="pc-look-die"></span></span></div>
        </div>
        <p class="net-wins" id="netMeWins"></p>
      </div>
      <span class="net-vs" aria-hidden="true">vs</span>
      <div class="net-seat" id="netThem">
        <div class="player-card" id="netThemCard">
          <div class="pc-name" id="netThemName"></div>
          <div class="pc-foot"><span class="net-ready" id="netThemReady"></span><span class="pc-look" id="netThemLook"><span class="pc-look-die"></span></span></div>
        </div>
        <p class="net-wins" id="netThemWins"></p>
      </div>
    </div>
    <div class="net-host" id="netHostOnly">
      <h2 class="net-code" id="netRoomCode"></h2>
      <div class="net-row">
        <input id="netRoomLink" type="text" readonly aria-label="Link to your room">
        <button class="menu-btn secondary" id="netCopyBtn" type="button">Copy link</button>
      </div>
    </div>
    <p class="net-room-status" id="netRoomStatus" aria-live="polite"></p>
    <div class="rules-cards" id="netRoomCards"></div>
    <div class="editor-buttons net-buttons">
      <button class="picker-back" id="netRoomBack">&larr; Leave</button>
      <button class="menu-btn secondary" id="netChangeBtn" type="button">Change</button>
      <button class="menu-btn" id="netReadyBtn" type="button" aria-pressed="false" disabled>Ready</button>
    </div>
  </div>
  <div class="menu-card wide" id="picker" hidden>
    <h2 class="picker-title" id="pickerTitle"></h2>
    <div class="picker-options" id="pickerOptions"></div>
    <button class="picker-back" id="pickerBack">&larr; Back</button>
  </div>
</div>

<div class="rules-overlay" id="rulesPopup" hidden role="dialog" aria-modal="true" aria-labelledby="rulesTitle">
  <div class="rules-card">
    <h2 class="picker-title" id="rulesTitle">This match</h2>
    <div class="rules-cards" id="rulesCards"></div>
    <button class="menu-btn" id="rulesClose">Back to the table</button>
  </div>
</div>

<script type="module" src="./src/main.js"></script>

</body>
</html>
